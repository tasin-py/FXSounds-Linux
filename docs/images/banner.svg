<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">FxSound for Linux</title>
  <desc id="d">The free audio enhancer, now native on Linux: same app, presets and sound as Windows, on PipeWire.</desc>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="320" rx="22"/></clipPath>
    <radialGradient id="glow" cx="0.78" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#e6335e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e6335e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6335e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e6335e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .font { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .float { animation: float 6s ease-in-out infinite; }
    .shine { animation: sweep 7s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 1.6s ease-in-out infinite; }
    .b2 { animation-delay: -0.4s; } .b3 { animation-delay: -0.8s; } .b4 { animation-delay: -1.2s; } .b5 { animation-delay: -0.6s; }
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: -0.3s; } .d3 { animation-delay: -0.6s; } .d4 { animation-delay: -0.9s; } .d5 { animation-delay: -1.2s; }
    .d6 { animation-delay: -1.5s; } .d7 { animation-delay: -1.8s; } .d8 { animation-delay: -2.1s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes sweep { 0% { transform: translateX(-520px) skewX(-18deg); } 60%, 100% { transform: translateX(1500px) skewX(-18deg); } }
    @keyframes bob { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { .float, .shine, .bar, .dot { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#141416"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <!-- faint EQ grid, like the app -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="3 6">
      <line x1="700" y1="70" x2="700" y2="290"/><line x1="770" y1="70" x2="770" y2="290"/>
      <line x1="840" y1="70" x2="840" y2="290"/><line x1="910" y1="70" x2="910" y2="290"/>
      <line x1="980" y1="70" x2="980" y2="290"/><line x1="1050" y1="70" x2="1050" y2="290"/>
      <line x1="1120" y1="70" x2="1120" y2="290"/><line x1="1190" y1="70" x2="1190" y2="290"/>
    </g>

    <!-- EQ curve with handles (the app's look) -->
    <g class="float">
      <path d="M700 200 L770 186 L840 172 L910 194 L980 214 L1050 198 L1120 226 L1190 204 L1190 290 L700 290 Z" fill="url(#area)"/>
      <polyline points="700,200 770,186 840,172 910,194 980,214 1050,198 1120,226 1190,204"
                fill="none" stroke="#e6335e" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#141416" stroke="#e6335e" stroke-width="4">
        <circle class="dot" cx="700" cy="200" r="8"/><circle class="dot d2" cx="770" cy="186" r="8"/>
        <circle class="dot d3" cx="840" cy="172" r="8"/><circle class="dot d4" cx="910" cy="194" r="8"/>
        <circle class="dot d5" cx="980" cy="214" r="8"/><circle class="dot d6" cx="1050" cy="198" r="8"/>
        <circle class="dot d7" cx="1120" cy="226" r="8"/><circle class="dot d8" cx="1190" cy="204" r="8"/>
      </g>
      <g class="font" fill="#8a8a92" font-size="13" text-anchor="middle">
        <text x="700" y="306">62 Hz</text><text x="840" y="306">250 Hz</text><text x="980" y="306">1.25 kHz</text>
        <text x="1120" y="306">7.5 kHz</text>
      </g>
    </g>

    <!-- logo + title -->
    <g class="float" style="animation-delay:-3s">
      <g fill="#e6335e">
        <rect class="bar" x="72" y="104" width="9" height="40" rx="3"/>
        <rect class="bar b2" x="87" y="92" width="9" height="52" rx="3"/>
        <rect class="bar b3" x="102" y="80" width="9" height="64" rx="3"/>
        <rect class="bar b4" x="117" y="96" width="9" height="48" rx="3"/>
        <rect class="bar b5" x="132" y="110" width="9" height="34" rx="3"/>
      </g>
      <text class="font" x="160" y="140" fill="#ffffff" font-size="56" font-weight="700" letter-spacing="-0.5">FxSound</text>
      <text class="font" x="404" y="140" fill="#e6335e" font-size="56" font-weight="300">for Linux</text>
      <text class="font" x="74" y="186" fill="#c9c9cf" font-size="21">The free audio enhancer, now native on Linux.</text>
      <text class="font" x="74" y="216" fill="#8a8a92" font-size="17">Same app, presets and sound as Windows · PipeWire · every major distro</text>

      <!-- chips -->
      <g class="font" font-size="14" font-weight="600">
        <rect x="74" y="244" width="118" height="30" rx="15" fill="none" stroke="#e6335e" stroke-opacity="0.7"/>
        <text x="133" y="264" fill="#ffffff" text-anchor="middle">10-band EQ</text>
        <rect x="204" y="244" width="176" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="292" y="264" fill="#c9c9cf" text-anchor="middle">Bit-identical to Windows</text>
        <rect x="392" y="244" width="146" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="465" y="264" fill="#c9c9cf" text-anchor="middle">Free &amp; open source</text>
      </g>
    </g>

    <!-- shine sweep -->
    <rect class="shine" x="0" y="-40" width="260" height="400" fill="url(#shine)"/>
    <rect x="0.5" y="0.5" width="1279" height="319" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
